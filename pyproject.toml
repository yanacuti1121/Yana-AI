[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yana-ai"
version = "1.5.1"
description = "Audits your AI coding agent setup before it can damage your repo. Scan first. Guard later."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Vũ Văn Tâm", email = "phamlongh230@gmail.com" }]
keywords = [
  "ai-agent", "claude-code", "security", "audit", "codex",
  "hooks", "safety", "skills", "knowledge-graph"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
audit = ["pip-audit>=2.0"]
presentation = ["python-pptx>=1.0.2"]

[project.urls]
Homepage    = "https://yanacuti1121.github.io/yana-ai/"
Repository  = "https://github.com/yanacuti1121/yana-ai"
Changelog   = "https://github.com/yanacuti1121/yana-ai/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/yanacuti1121/yana-ai/issues"

[project.scripts]
yana-ai    = "yana_ai.cli:main"
yana-rt = "yana_ai.rt:main"
yana-ai-rt = "yana_ai.rt:chat_main"

[tool.hatch.build.targets.wheel]
packages = ["src/yana_ai"]

# bin/yana + its supporting core/ dirs live outside src/yana_ai/ in the
# repo. force-include copies them INTO the installed package directory
# (site-packages/yana_ai/bin, .../core, etc.) so cli.py's subprocess call
# to "bin/yana" (relative to its own package dir) actually finds a real
# file after a normal `pip install`, not just in an editable/dev checkout.
[tool.hatch.build.targets.wheel.force-include]
"bin" = "yana_ai/bin"
"core/adapters" = "yana_ai/core/adapters"
"core/agents" = "yana_ai/core/agents"
"core/bus" = "yana_ai/core/bus"
"core/ci" = "yana_ai/core/ci"
"core/commands" = "yana_ai/core/commands"
"core/config" = "yana_ai/core/config"
"core/gates" = "yana_ai/core/gates"
"core/hooks" = "yana_ai/core/hooks"
"core/knowledge" = "yana_ai/core/knowledge"
"core/lib" = "yana_ai/core/lib"
"core/mcp" = "yana_ai/core/mcp"
"core/monitor" = "yana_ai/core/monitor"
"core/rules" = "yana_ai/core/rules"
"core/sandbox" = "yana_ai/core/sandbox"
"core/scripts" = "yana_ai/core/scripts"
"core/skills" = "yana_ai/core/skills"
"core/templates" = "yana_ai/core/templates"
"core/tests" = "yana_ai/core/tests"
# core/memory: only the two code files ship. L2_session/, agent-journals/, audit/ and trust-ledger.json are per-user
# state (session summaries, agent journals, audit log, trust scores) and must never go into a published package.
# Do not map "core" as a whole here: force-include ignores exclude rules, which is how that state reached PyPI in 1.5.1.
"core/memory/secure-logger.js" = "yana_ai/core/memory/secure-logger.js"
"core/memory/trust-ledger.js" = "yana_ai/core/memory/trust-ledger.js"
".claude-plugin" = "yana_ai/.claude-plugin"
"gates" = "yana_ai/gates"
"scanner" = "yana_ai/scanner"
"policy" = "yana_ai/policy"
"adapters" = "yana_ai/adapters"
".codex/config.toml" = "yana_ai/.codex/config.toml"
".codex/hooks.json" = "yana_ai/.codex/hooks.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "bin/",
  "core/",
  ".claude-plugin/",
  "gates/",
  "scanner/",
  "policy/",
  "adapters/",
  ".codex/config.toml",
  ".codex/hooks.json",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]
# `python -m build` builds the wheel FROM this sdist, so the sdist must not carry per-user state either.
exclude = [
  "core/memory/L2_session",
  "core/memory/agent-journals",
  "core/memory/audit",
  "core/memory/trust-ledger.json",
]
