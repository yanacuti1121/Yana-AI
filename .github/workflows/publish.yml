name: Publish to PyPI + crates.io

# Two independent version axes (see VERSIONING.md): the yana-rt crate
# (crates.io, Cargo.toml) and the Python package (PyPI, pyproject.toml).
# Each axis has its own tag prefix so pushing one axis's tag never
# touches the other's file.
#
# A third axis, product (npm, package.json/MANIFEST.json), was removed
# 2026-07-30 — the npm package (tried as unscoped `yana-ai`, then
# `@vutam-yana-ai/yana-ai`, then `@yanacuti/yana-ai` — three attempts,
# three 403s, full history in VERSIONING.md) is no longer distributed
# via npm. `package.json` still exists for local tooling (test/deploy/
# electron-build scripts, `postinstall`) and is marked `"private": true`
# so it can never be published by accident. Do not re-add an npm publish
# job without new evidence from npm support that the account-level block
# is actually resolved — see VERSIONING.md's 2026-08-01 entry for why a
# passing local dry-run isn't that evidence.
#
# Before 2026-07-05 all three jobs (npm included, at the time) ran
# unconditionally on any `v[0-9]+.[0-9]+.[0-9]+` tag and each force-set
# its own version file to that same tag number, silently collapsing the
# axes into one and contradicting VERSIONING.md's own stated design.
#
# Reviewed 2026-07-05 (security-auditor + code-auditor per
# 54-bft-consensus-law.md) before this version landed. Two things the
# first draft of this fix got wrong, now fixed:
# 1. `github.ref_name` is populated on every trigger, including
#    workflow_dispatch (it reflects whichever ref was picked to run the
#    workflow from), so a ref_name-based condition with no event_name
#    guard could fire alongside a workflow_dispatch run that selected a
#    different target, publishing two registries at once. Every
#    ref_name/tag_name clause below is now scoped to its own event type.
# 2. The "Set version from tag" step interpolated the tag name directly
#    into `${{ }}` inside the shell script. Git tag names can contain
#    `$()`/backticks (not blocked by git's ref-name rules), so a
#    maliciously named tag driving a `release: published` event could
#    inject shell commands into a job holding publish secrets. Fixed by
#    passing the raw value through `env:` and referencing it as a quoted
#    shell variable instead, so its contents are never re-parsed as
#    script text.
on:
    push:
      tags:
        - 'rt-v[0-9]+.[0-9]+.[0-9]+'   # yana-rt crate version -> crates.io only
        - 'py-v[0-9]+.[0-9]+.[0-9]+'   # Python package version -> PyPI only
    release:
      types: [published]
    workflow_dispatch:
      inputs:
        target:
          description: 'Which registry to publish'
          required: true
          type: choice
          options: [pypi, crates]
          default: 'pypi'
        # Separate version fields per target -- a single shared field
        # (removed 2026-07-30) let someone select target=crates while
        # typing a PyPI-axis-looking number, which crates.io then
        # rejected as "already exists" since these two axes are
        # genuinely independent (see VERSIONING.md). Each field below is
        # only read by its own job, defaulted to that axis's own current
        # version, so a wrong-axis number can no longer cross over.
        pypi_version:
          description: 'PyPI version (only used when target=pypi, e.g. 0.42.4)'
          required: false
          default: '0.42.4'
        crates_version:
          description: 'crates.io version (only used when target=crates, e.g. 1.3.3)'
          required: false
          default: '1.3.3'

jobs:
  # Workstream B / B7 follow-up (2026-08-16): same "release gate weaker
  # than PR gate" fix as release.yml/desktop.yml -- see release.yml's
  # comment on its own verify-provenance job for the full rationale.
  # Runs unconditionally (no per-target `if:`) since either publish job
  # below can depend on it via `needs:` regardless of which target this
  # run is actually publishing to -- simpler than duplicating the
  # publish-pypi/publish-crates `if:` conditions here. Consequences of
  # skipping this on a genuinely broken commit are higher here than for
  # release.yml/desktop.yml: crates.io and PyPI don't allow re-uploading
  # a version number once yanked, unlike a GitHub Release asset.
  verify-provenance:
    name: Verify commit passed required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify required checks succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REQUIRED=(
            "Hook Tests"
            "Kernel flock-v1 (Ubuntu)"
            "Rust Integration Tests (yana-rt)"
            "System Health Monitor (ubuntu-latest)"
            "System Health Monitor (macos-latest)"
            "System Health Monitor (windows-latest)"
            "Yana AI Self-Audit (dogfooding — scanner/*.yml on this repo)"
          )
          FAILED=0
          for name in "${REQUIRED[@]}"; do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq ".check_runs[] | select(.name==\"$name\") | .conclusion" | head -1)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$name' did not succeed for commit $SHA (conclusion: ${conclusion:-none found})"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "This commit did not pass all of main's required checks."
            echo "Refusing to publish from unverified code."
            exit 1
          fi
          echo "All required checks succeeded for $SHA — proceeding with publish."

  publish-pypi:
    name: PyPI — yana-ai
    needs: verify-provenance
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'py-v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'py-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/yana-ai/
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ inputs.pypi_version || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (node24)
        with:
          python-version: "3.12"

      - name: Set version from tag
        run: |
          VERSION="$RAW_VERSION"
          VERSION="${VERSION#py-v}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" src/yana_ai/__init__.py

      - name: Install build tools
        run: pip install hatchling build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  publish-crates:
    name: crates.io — yana-rt
    needs: verify-provenance
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'rt-v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'rt-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'crates')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Workstream B / B5 (workflow permissions, least privilege): this
    # job only checks out code and publishes to crates.io via
    # CARGO_REGISTRY_TOKEN -- it never writes back to the repo, unlike
    # publish-pypi it lacked an explicit permissions block, silently
    # inheriting the repo's default GITHUB_TOKEN permission instead of
    # declaring what it actually needs. Confirmed via `gh api
    # repos/.../actions/permissions/workflow` that the current default
    # is already "read", so this closes a defense-in-depth gap rather
    # than a live over-grant -- but that default is repo-level config,
    # not something this workflow file controls, so it shouldn't be
    # the only thing standing between this job and write access.
    permissions:
      contents: read
    environment:
      name: crates-io
      url: https://crates.io/crates/yana-rt
    env:
      RAW_VERSION: ${{ inputs.crates_version || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Set version from tag
        run: |
          VERSION="$RAW_VERSION"
          VERSION="${VERSION#rt-v}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24)
        with:
          path: ~/.cargo/registry
          key: cargo-publish-${{ hashFiles('Cargo.lock') }}

      # crates.io versions are immutable — cargo publish has no equivalent
      # of pypa/gh-action-pypi-publish's skip-existing flag, so a re-run
      # against an already-published version always fails loudly. Checked
      # here instead, mirroring the PyPI job's skip-existing behavior.
      - name: Check whether this version is already published
        id: check_published
        run: |
          # No -f: we need the actual status code even on 4xx, not a
          # curl exit failure. crates.io also 403s any request without a
          # descriptive User-Agent (see https://crates.io/data-access) --
          # the missing header, not a real access problem, caused this
          # step to fail closed on its first real run.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: yana-ai-ci (https://github.com/yanacuti1121/Yana-AI)" \
            "https://crates.io/api/v1/crates/yana-rt/$VERSION")
          if [[ "$status" == "200" ]]; then
            echo "yana-rt@$VERSION already exists on crates.io — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check_published.outputs.skip != 'true'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
