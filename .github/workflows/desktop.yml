name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.AppImage
              tools/yana-desktop/dist/*.AppImage.blockmap
              tools/yana-desktop/dist/latest-linux.yml
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: |
              tools/yana-desktop/dist/*.AppImage
              tools/yana-desktop/dist/*.AppImage.blockmap
              tools/yana-desktop/dist/latest-linux-arm64.yml
          - os: macos-15-intel
            platform: mac
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.dmg
              tools/yana-desktop/dist/*.zip
              tools/yana-desktop/dist/*.zip.blockmap
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: |
              tools/yana-desktop/dist/*.dmg
              tools/yana-desktop/dist/*.zip
              tools/yana-desktop/dist/*.zip.blockmap
              tools/yana-desktop/dist/latest-mac.yml
          - os: windows-latest
            platform: win
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.exe
              tools/yana-desktop/dist/*.exe.blockmap
              tools/yana-desktop/dist/latest.yml

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Generate 512×512 icon from SVG (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y imagemagick
          convert -background none tools/yana-desktop/build/icon.svg \
            -resize 512x512 tools/yana-desktop/build/icon.png

      - name: Generate 512×512 icon from SVG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install imagemagick
          magick -background none tools/yana-desktop/build/icon.svg \
            -resize 512x512 tools/yana-desktop/build/icon.png

      - name: Install web dependencies
        working-directory: tools/yana-web
        run: npm ci

      - name: Build desktop web UI
        working-directory: tools/yana-web
        run: npm run build:desktop

      - name: Build bundled runtime
        run: cargo build --release --features cli,pty-bridge --bin yana-rt --bin pty_bridge

      # Workstream B / B1 (Release artifact assurance) -- same gap as
      # release.yml: this job stages these two binaries straight into
      # the Electron app bundle with nothing verifying either one
      # actually runs first. yana-rt's --version path is already
      # proven in release.yml; pty_bridge has no CLI flags to probe
      # startup with, so this checks the one thing every executable
      # supports -- that the OS loader accepts it (dynamic libs
      # resolve, correct architecture) -- via `file`, not an execution
      # that would hang waiting on a pty. Windows skipped: no `file`
      # command there, and its behavior needs its own investigation
      # rather than a guessed equivalent.
      - name: Smoke test bundled runtime binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target/release/yana-rt --version
          file target/release/pty_bridge | grep -qi "executable" || {
            echo "pty_bridge does not look like a valid executable" >&2
            exit 1
          }

      - name: Install yana-desktop dependencies
        working-directory: tools/yana-desktop
        run: npm ci

      - name: Stage bundled runtime
        working-directory: tools/yana-desktop
        run: npm run stage:runtime

      - name: Build app
        working-directory: tools/yana-desktop
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: yana-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          retention-days: 30

      - name: Attach installers and updater metadata to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@da05d552573ad5aba039daea1a452d2b0cac0bf7
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
