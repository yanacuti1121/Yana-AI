name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Workstream B / B7 follow-up (2026-08-16): same "release gate weaker
  # than PR gate" fix as release.yml -- see that file's own comment on
  # this job for the full rationale. This workflow additionally triggers
  # via workflow_dispatch (manual), not just tag push; the check still
  # applies the same way -- github.sha is whatever ref was selected at
  # dispatch time, and this verifies that commit passed CI regardless of
  # how the build was triggered.
  verify-provenance:
    name: Verify commit passed required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify required checks succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REQUIRED=(
            "Hook Tests"
            "Kernel flock-v1 (Ubuntu)"
            "Rust Integration Tests (yana-rt)"
            "System Health Monitor (ubuntu-latest)"
            "System Health Monitor (macos-latest)"
            "System Health Monitor (windows-latest)"
            "Yana AI Self-Audit (dogfooding — scanner/*.yml on this repo)"
          )
          FAILED=0
          for name in "${REQUIRED[@]}"; do
            # --paginate: gh api's default page size is 30. This commit's
            # check-runs count has grown past that (CodeQL alone adds 4
            # more), so an unpaginated call silently drops required
            # checks that land on page 2+ and reports "none found" for
            # them even though they succeeded -- real bug, found live
            # after 7 failed desktop.yml dispatches this release that
            # were misdiagnosed as a timing race, not a pagination gap.
            conclusion=$(gh api --paginate "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq ".check_runs[] | select(.name==\"$name\") | .conclusion" | head -1)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$name' did not succeed for commit $SHA (conclusion: ${conclusion:-none found})"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "This commit did not pass all of main's required checks."
            echo "Refusing to build/publish a desktop release from unverified code."
            exit 1
          fi
          echo "All required checks succeeded for $SHA — proceeding with build."

  build:
    needs: verify-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.AppImage
              tools/yana-desktop/dist/*.AppImage.blockmap
              tools/yana-desktop/dist/*.deb
              tools/yana-desktop/dist/latest-linux.yml
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: |
              tools/yana-desktop/dist/*.AppImage
              tools/yana-desktop/dist/*.AppImage.blockmap
              tools/yana-desktop/dist/*.deb
              tools/yana-desktop/dist/latest-linux-arm64.yml
          - os: macos-15-intel
            platform: mac
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.dmg
              tools/yana-desktop/dist/*.dmg.blockmap
              tools/yana-desktop/dist/*.zip
              tools/yana-desktop/dist/*.zip.blockmap
              tools/yana-desktop/dist/latest-mac.yml
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: |
              tools/yana-desktop/dist/*.dmg
              tools/yana-desktop/dist/*.dmg.blockmap
              tools/yana-desktop/dist/*.zip
              tools/yana-desktop/dist/*.zip.blockmap
              tools/yana-desktop/dist/latest-mac.yml
          - os: windows-latest
            platform: win
            arch: x64
            artifact: |
              tools/yana-desktop/dist/*.exe
              tools/yana-desktop/dist/*.exe.blockmap
              tools/yana-desktop/dist/latest.yml

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Generate 512×512 icon from SVG (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y imagemagick
          convert -background none tools/yana-desktop/build/icon.svg \
            -resize 512x512 tools/yana-desktop/build/icon.png

      - name: Generate 512×512 icon from SVG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install imagemagick
          magick -background none tools/yana-desktop/build/icon.svg \
            -resize 512x512 tools/yana-desktop/build/icon.png

      - name: Install web dependencies
        working-directory: tools/yana-web
        run: npm ci

      - name: Build desktop web UI
        working-directory: tools/yana-web
        run: npm run build:desktop

      - name: Build bundled runtime
        run: cargo build --release --features cli,pty-bridge --bin yana-rt --bin pty_bridge

      # Workstream B / B1 (Release artifact assurance) -- same gap as
      # release.yml: this job stages these two binaries straight into
      # the Electron app bundle with nothing verifying either one
      # actually runs first. yana-rt's own startup/dispatch/authority
      # surface is proven the same way release.yml proves it (Authority
      # Hardening item #11, 2026-08-28): core/scripts/release-smoke-
      # test.sh, execing this exact bundled binary, not --version alone.
      # pty_bridge has no CLI flags to probe startup with, so this checks
      # the one thing every executable supports -- that the OS loader
      # accepts it (dynamic libs resolve, correct architecture) -- via
      # `file`, not an execution that would hang waiting on a pty.
      # Windows skipped: no `file` command there, and its behavior needs
      # its own investigation rather than a guessed equivalent.
      - name: Smoke test bundled runtime binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash core/scripts/release-smoke-test.sh target/release/yana-rt
          file target/release/pty_bridge | grep -qi "executable" || {
            echo "pty_bridge does not look like a valid executable" >&2
            exit 1
          }

      - name: Install yana-desktop dependencies
        working-directory: tools/yana-desktop
        run: npm ci

      - name: Stage bundled runtime
        working-directory: tools/yana-desktop
        run: npm run stage:runtime

      - name: Verify staged runtime feature contract
        working-directory: tools/yana-desktop
        run: npm run verify:runtime

      - name: Test desktop shell
        working-directory: tools/yana-desktop
        run: npm test
        env:
          YANA_REQUIRE_RUNTIME_TEST: '1'

      - name: Build app
        working-directory: tools/yana-desktop
        run: node node_modules/electron-builder/cli.js --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: yana-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Verify and publish complete desktop release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '24'

      - name: Download all desktop build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (node24)
        with:
          pattern: yana-desktop-*
          path: desktop-artifacts

      - name: Verify tag and assemble updater feeds
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./tools/yana-desktop/package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop package version ${VERSION}"
            exit 1
          fi
          node tools/yana-desktop/scripts/assemble-release.js \
            desktop-artifacts desktop-release-assets "$VERSION"

      - name: Attach verified desktop release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 (node24)
        with:
          files: desktop-release-assets/*
          fail_on_unmatched_files: true
