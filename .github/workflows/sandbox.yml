name: Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - 'core/sandbox/**'
      - '.github/workflows/sandbox.yml'
  pull_request:
    paths:
      - 'core/sandbox/**'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/yanacuti1121/yana-ai-sandbox

jobs:
  build:
    name: Build yana-ai-sandbox Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 (node24)

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0 (node24)
        with:
          context: core/sandbox
          file: core/sandbox/Dockerfile.sandbox
          push: false
          tags: yana-ai-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — exec
        run: |
          docker run --rm \
            --network none --read-only \
            --tmpfs /workspace:rw,size=64m,noexec \
            --tmpfs /tmp:rw,size=32m,noexec \
            --cap-drop ALL --security-opt no-new-privileges \
            --user nobody \
            yana-ai-sandbox:latest echo "smoke test passed"

      - name: Smoke test — network blocked
        run: |
          docker run --rm \
            --network none --read-only \
            --tmpfs /workspace:rw,size=64m,noexec \
            --cap-drop ALL --security-opt no-new-privileges \
            --user nobody \
            yana-ai-sandbox:latest \
            bash -c "wget -q http://example.com -O /dev/null 2>&1 && echo FAIL || echo 'network blocked — PASS'"

      - name: Smoke test — filesystem read-only
        run: |
          docker run --rm \
            --network none --read-only \
            --tmpfs /workspace:rw,size=64m,noexec \
            --cap-drop ALL --security-opt no-new-privileges \
            --user nobody \
            yana-ai-sandbox:latest \
            bash -c "echo pwned > /etc/pwned 2>&1 && echo FAIL || echo 'read-only FS — PASS'"

  publish:
    name: Publish yana-ai-sandbox to GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0 (node24)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image to GitHub Container Registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0 (node24)
        with:
          context: core/sandbox
          file: core/sandbox/Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Minimal ephemeral sandbox for Yana AI agent tool commands
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
