name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Workstream B / B7 follow-up (2026-08-16): closes the "release gate is
  # weaker than PR gate" finding from B7-documentation-claims-self-
  # governance-audit.md. This workflow only triggers on tag push, and
  # ci.yml never triggers on tag push either -- so before this job, NO
  # release build ever re-ran or re-verified the PR-gate required checks
  # against the exact commit being tagged. A tag pushed against any
  # commit/branch (not necessarily one that ever passed CI on main) would
  # build and publish regardless. This job verifies -- via GitHub's own
  # recorded check-run results for the tagged commit, not by re-running
  # the whole suite a second time (expensive, and also wouldn't prove the
  # commit was ever actually reviewed/merged through main's required-
  # checks gate the way the recorded check-runs do) -- that every check
  # main's branch protection currently requires actually succeeded for
  # this exact commit SHA before any binary gets built from it.
  #
  # Known limits, not solved here: (1) this list is a manual copy of
  # main's required_status_checks.contexts -- reading branch protection
  # settings via the API requires repo-admin scope, which a standard
  # GITHUB_TOKEN in this workflow does not have, so it can't be fetched
  # dynamically; if the required-check set changes, this list needs a
  # matching edit. (2) GitHub does not guarantee check-run history is
  # retained indefinitely, so a tag pushed against a very old commit
  # could fail this step even if that commit genuinely passed CI at the
  # time -- an edge case, not exercised by this repo's actual release
  # cadence, and not something this step attempts to work around.
  verify-provenance:
    name: Verify tagged commit passed required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify required checks succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          # Single source of truth (Authority Hardening item #10):
          # .github/required-checks.json, also read by publish.yml, so the
          # two workflows can no longer drift into two different copies of
          # this list the way they used to (byte-for-byte-identical
          # hardcoded arrays, confirmed via diff before this change).
          REQUIRED=()
          while IFS= read -r name; do
            REQUIRED+=("$name")
          done < <(python3 -c "import json; print('\n'.join(json.load(open('.github/required-checks.json'))['required_checks']))")
          FAILED=0
          for name in "${REQUIRED[@]}"; do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq ".check_runs[] | select(.name==\"$name\") | .conclusion" | head -1)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$name' did not succeed for commit $SHA (conclusion: ${conclusion:-none found})"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "This tag's commit did not pass all of main's required checks."
            echo "Refusing to build/publish a release from unverified code."
            exit 1
          fi
          echo "All required checks succeeded for $SHA — proceeding with release build."

  build:
    needs: verify-provenance
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: yana-rt
            asset: yana-rt-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: yana-rt
            asset: yana-rt-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: yana-rt
            asset: yana-rt-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: yana-rt.exe
            asset: yana-rt-windows-x64.exe

    steps:
      # BUG FIX (Workstream B / A8, 2026-08-16): actions/checkout and
      # action-gh-release were floating tags (@v4, @v2) on the exact
      # workflow that builds the CLI binaries end users download, unlike
      # every other workflow in this repo (ci.yml, publish.yml,
      # sandbox.yml), which SHA-pin every action. A floating tag can be
      # moved by the action's maintainer, or an attacker who compromises
      # that maintainer's account, to point at different code — the next
      # release build would pull it silently. Pinned to the exact commit
      # each tag currently resolves to (verified via GitHub's API, not
      # guessed), so this is not a behavior change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Workstream B / B1 (Release artifact assurance): before this,
      # nothing verified the binary this job is about to publish to a
      # GitHub Release actually RUNS -- confirmed by reading this file
      # before adding anything: build then upload, no step in between.
      # A binary that compiles but crashes on startup (missing dynamic
      # library, wrong target linking, a panic in early init) would have
      # shipped to every user downloading that release with nobody
      # having executed it even once.
      #
      # Authority Hardening item #11 (2026-08-28): `--version` alone
      # proves argument parsing and startup far enough to rule out "dead
      # on arrival," and nothing more -- a binary that answers --version
      # but panics on its first real subcommand would still have shipped.
      # Replaced with core/scripts/release-smoke-test.sh, a golden smoke
      # test that execs THIS EXACT built binary (never a separately built
      # copy) through 11 real, offline checks: startup, CLI dispatch,
      # the capability sandbox read path, the Giam Thi HALT lock
      # (create/status/unlock), a full Capability Lease grant/list/
      # revoke round-trip, and the authority-receipts reader. No network
      # call, no model provider credential -- see that script's own
      # header for the one thing it honestly cannot exercise offline
      # (RuntimeAuthority::capability_decision itself, which needs a
      # live TurnEngine/chat session).
      #
      # Skipped for the macos-latest x86_64-apple-darwin leg specifically:
      # that's a cross-compile on GitHub's arm64 macOS runners, and
      # whether Rosetta 2 transparently executes it there wasn't
      # something I could verify from outside GitHub's own runner
      # environment -- documented here rather than silently wrapped in
      # continue-on-error, which would hide a REAL failure on the three
      # native-arch legs just as easily as a false one on this leg.
      - name: Smoke test the built binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: bash core/scripts/release-smoke-test.sh target/${{ matrix.target }}/release/${{ matrix.binary }}

      # Workstream B / B3 (A8 Release & Supply Chain): the program
      # document requires a release manifest ("commit SHA, product
      # version, yana-rt version, OS/arch, Rust toolchain, feature
      # flags, Cargo.lock digest, artifact SHA256, build timestamp, CI
      # run identity") so a published binary can be traced back to
      # exactly what produced it. None of this existed before -- a
      # downloaded binary had no way to prove which commit, toolchain,
      # or lockfile state it came from short of trusting the release
      # notes. Two version numbers deliberately: "product version"
      # (MANIFEST.json's version field, 1.3.2 as of this writing) and
      # "yana-rt version" (Cargo.toml's version field, 1.4.0) are
      # independent axes by this repo's own VERSIONING.md -- collapsing
      # them into one number would misrepresent the actual scheme.
      # This is provenance, not a reproducibility claim: per the
      # document's own instruction ("if bit-for-bit reproducibility is
      # not yet real, record provenance rather than claiming it"), this
      # step does not attempt to verify the build is reproducible, only
      # to record exactly what produced this specific artifact.
      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          # macOS runners don't ship GNU coreutils' sha256sum by default
          # (BSD userland has shasum instead) -- ubuntu-latest and
          # windows-latest's git-bash both do. Prefer sha256sum, fall
          # back to shasum -a 256 so this one step works on all three
          # runner OSes this matrix actually uses.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256() { sha256sum "$1" | awk '{print $1}'; }
          else
            sha256() { shasum -a 256 "$1" | awk '{print $1}'; }
          fi
          # BUG FIX (found by independent fresh-context review, 2026-08-16):
          # this originally called `python3` unconditionally on all 4
          # matrix legs including windows-latest. Stock Windows runner
          # images expose `python`, not `python3` -- there's no
          # actions/setup-python step in this workflow that would create
          # a python3 shim, and this repo already knows the same gap
          # exists elsewhere (ci.yml's own only other python3-on-a-
          # Windows-capable-matrix call is explicitly gated `if:
          # runner.os != 'Windows'`). Same command-v fallback style as
          # the sha256 helper immediately above, so the release would
          # have failed outright on the Windows leg with no binary
          # published for it, not silently produced a wrong manifest.
          PYTHON_BIN="$(command -v python3 || command -v python)"
          PRODUCT_VERSION=$("$PYTHON_BIN" -c "import json; print(json.load(open('MANIFEST.json', encoding='utf-8'))['version'])")
          YANA_RT_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          CARGO_LOCK_SHA256=$(sha256 Cargo.lock)
          ARTIFACT_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          ARTIFACT_SHA256=$(sha256 "$ARTIFACT_PATH")
          RUST_TOOLCHAIN=$(rustc --version)
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > "${{ matrix.asset }}.manifest.json" <<EOF
          {
            "commit_sha": "${{ github.sha }}",
            "product_version": "$PRODUCT_VERSION",
            "yana_rt_version": "$YANA_RT_VERSION",
            "target": "${{ matrix.target }}",
            "rust_toolchain": "$RUST_TOOLCHAIN",
            "feature_flags": "default",
            "cargo_lock_sha256": "$CARGO_LOCK_SHA256",
            "artifact_sha256": "$ARTIFACT_SHA256",
            "build_timestamp_utc": "$BUILD_TIMESTAMP",
            "ci_run_id": "${{ github.run_id }}",
            "ci_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          cat "${{ matrix.asset }}.manifest.json"

      - name: Upload binary to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            ${{ matrix.asset }}.manifest.json
          asset_name: ${{ matrix.asset }}
