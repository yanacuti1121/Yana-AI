name: Yana AI Audit

# Example workflow — copy this into YOUR repo (not the yana-ai repo itself)
# to run yana-ai audit in CI and fail on high-risk findings.
#
# Usage:
#   1. Copy this file to .github/workflows/yana-ai-audit.yml in your project
#   2. Adjust FAIL_ON_LEVEL to your preferred threshold (low/medium/high/critical)
#   3. Adjust YANA_REF to pin a specific release tag (recommended for reproducibility)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  yana-ai-audit:
    name: Yana AI Agent Setup Audit
    # This is a demo/example workflow. Skip it on the yana-ai repo itself.
    # The name must track the repository owner: after the move to the Horonomos-laps organization the
    # old name no longer matched, so the demo started running here and failed on every run.
    if: github.repository != 'Horonomos-laps/Yana-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # required for SARIF upload to GitHub Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0   # pull_request mode audits `--diff origin/<base>`, which needs that ref

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 (node24)
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Install yana-rt
        run: cargo install yana-rt

      - name: Install Yana AI
        run: |
          YANA_REF="main"   # pin to a release tag in production, e.g. "v1.8.0"
          git clone --depth 1 --branch "$YANA_REF" \
            https://github.com/yanacuti1121/yana-ai.git /tmp/yana-ai
          chmod +x /tmp/yana-ai/bin/yana

      - name: Run Yana AI audit
        env:
          FAIL_ON_LEVEL: high   # fail CI on HIGH or CRITICAL findings (adjust as needed)
        run: |
          # On PRs: scan only changed files. On push to main: scan everything.
          DIFF_FLAG=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DIFF_FLAG="--diff origin/${{ github.base_ref }}"
          fi

          /tmp/yana-ai/bin/yana audit . \
            $DIFF_FLAG \
            --fail-on "$FAIL_ON_LEVEL" \
            --ignore AU010 \
            --ignore CI008 \
            --sarif yana-ai-audit.sarif \
            --markdown yana-ai-audit-report.md

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: yana-ai-audit.sarif
          category: yana-ai-agent-audit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: yana-ai-audit-report
          path: |
            yana-ai-audit-report.md
            yana-ai-audit.sarif
          retention-days: 30
