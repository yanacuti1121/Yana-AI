name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Hook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          python3 -m pip install -r requirements-dev.txt

      # guard-blast-radius.sh's 4 test cases in run-hook-tests.sh are
      # Rust-only (no bash fallback — see the hook's own header comment)
      # and SKIP silently without a built target/release/yana-rt. That
      # meant this guard had never actually run in CI, on any commit,
      # ever — which is exactly how a real absolute-path bypass regression
      # in src/guard/blast_paths.rs went undetected until it was caught by
      # chance during a manual local run (see the 2026-07-03 fix commit).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Prefetch pdfium (avoids intermittent TLS failure in liteparse-pdfium-sys's own downloader)
        run: bash core/scripts/prefetch-pdfium.sh

      - name: Build yana-rt (release, for guard-blast-radius.sh)
        run: cargo build --release --bin yana-rt

      - name: Run hook test suite
        run: bash core/tests/hooks/run-hook-tests.sh

      - name: Drift check
        run: bash core/scripts/drift-check.sh

      - name: Check README/architecture.md counts against the filesystem
        run: python3 core/scripts/generate-stats.py --check

      - name: Check for dangling paths (package.json cd targets, files[], within-axis versions)
        run: python3 core/scripts/check_dangling_paths.py

      - name: Check guards/index.yml drift
        run: python3 core/scripts/gen_guards_index.py --check

      - name: Verify install script is executable
        run: bash -n install.sh

      - name: Check compiled scanner rule drift
        run: python3 core/scripts/compile_scanner_rules.py --check

      - name: Validate Harness Scaling schema examples
        run: python3 tests/test_harness_schema_examples.py

      - name: Validate .yana-aiignore regression behavior
        run: python3 tests/test_yanaignore.py

      - name: Validate spec command regression behavior
        run: python3 tests/test_validate_spec.py

      - name: Validate context-pack checker regression behavior
        run: python3 tests/test_context_pack_check.py

      - name: Validate validator JSON schema contract
        run: python3 tests/test_validator_json_schema.py

      - name: Validate audit JSON MVP regression behavior
        run: python3 -m pytest tests/test_audit_json_mvp.py -q

      - name: Validate agent routing map regression behavior
        run: python3 tests/test_agent_routing_map.py

  flock-v1-linux:
    name: Kernel flock-v1 (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Prefetch pdfium (avoids intermittent TLS failure in liteparse-pdfium-sys's own downloader)
        run: bash core/scripts/prefetch-pdfium.sh

      - name: Build debug runtime
        run: cargo build --bin yana-rt

      - name: Run Rust and Python flock units
        run: |
          cargo test --features flock-v1 flock_v1::tests -- --test-threads=1
          PYTHONPATH="$PWD" python3 -m unittest -v core.tests.locking.test_flock_v1

      - name: Run cutover regression
        run: bash core/tests/locking/test-flock-v1-cutover.sh

      - name: Run cross-language matrix five times
        run: |
          for run in 1 2 3 4 5; do
            echo "flock-v1 matrix run $run/5"
            bash core/tests/locking/test-flock-v1-production.sh
          done
          cd /tmp
          bash "$GITHUB_WORKSPACE/core/tests/locking/test-flock-v1-production.sh"

      - name: Build desktop release runtimes
        run: cargo build --release --features cli,pty-bridge --bin yana-rt --bin pty_bridge

      - name: Verify npm, PyPI, and desktop runtime surfaces
        run: bash core/tests/locking/test-flock-v1-packaging.sh

      - name: Check patch whitespace
        run: git diff --check

  rust-tests:
    name: Rust Integration Tests (yana-rt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prefetch pdfium (avoids intermittent TLS failure in liteparse-pdfium-sys's own downloader)
        run: bash core/scripts/prefetch-pdfium.sh

      - name: Build yana-rt
        run: cargo build --bin yana-rt

      - name: Check main.rs / bin/yana dispatch drift
        run: ./target/debug/yana-rt doctor dispatch . --json

      # ADR-008: `cargo test --test integration_runtime` (below) only runs
      # that one named integration binary — it does NOT pick up
      # `#[cfg(test)] mod tests` blocks inside src/*.rs (e.g.
      # src/guard/lock.rs's own unit tests), which is a bare `cargo test`
      # invocation this repo didn't have until now. --test-threads=1
      # because guard::blast_paths' existing tests have a known $PWD race
      # under parallel execution (see that module's own test comments) —
      # unrelated to this addition, but this step would otherwise
      # intermittently fail on it.
      - name: Run unit tests
        run: cargo test --bin yana-rt -- --test-threads=1

      - name: Run integration tests
        run: cargo test --test integration_runtime -- --test-threads=4

  system-health-monitor:
    name: System Health Monitor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-system-health-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-system-health-

      - name: Prefetch pdfium (avoids intermittent TLS failure in liteparse-pdfium-sys's own downloader)
        if: runner.os != 'Windows'
        run: bash core/scripts/prefetch-pdfium.sh

      - name: Run monitor units and build runtime
        run: |
          cargo test --bin yana-rt os::monitor -- --test-threads=1
          cargo build --bin yana-rt

      - name: Smoke sample and show (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="$(mktemp -d)"
          ./target/debug/yana-rt os monitor sample --dir "$root" --json > "$root/sample.json"
          ./target/debug/yana-rt os monitor show --dir "$root" --json > "$root/show.json"
          ./target/debug/yana-rt os monitor service status --dir "$root" --json > "$root/service.json"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          sample = json.loads((root / "sample.json").read_text())
          shown = json.loads((root / "show.json").read_text())
          service = json.loads((root / "service.json").read_text())
          assert sample == shown
          assert sample["platform"] in {"linux", "macos"}
          assert sample["cpu"]["logical_cores"] > 0
          assert sample["memory"]["total_bytes"] > 0
          assert sample["disk"]["total_bytes"] > 0
          assert service["installed"] is False
          assert (root / ".yana-ai/os/system-health.json").is_file()
          PY

      - name: Smoke sample and show (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "yana-monitor-smoke"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          .\target\debug\yana-rt.exe os monitor sample --dir $root --json | Set-Content -Encoding utf8 "$root\sample.json"
          .\target\debug\yana-rt.exe os monitor show --dir $root --json | Set-Content -Encoding utf8 "$root\show.json"
          .\target\debug\yana-rt.exe os monitor service status --dir $root --json | Set-Content -Encoding utf8 "$root\service.json"
          $sample = Get-Content -Raw "$root\sample.json" | ConvertFrom-Json
          $shown = Get-Content -Raw "$root\show.json" | ConvertFrom-Json
          $service = Get-Content -Raw "$root\service.json" | ConvertFrom-Json
          if (($sample | ConvertTo-Json -Depth 8 -Compress) -ne ($shown | ConvertTo-Json -Depth 8 -Compress)) { throw "sample/show mismatch" }
          if ($sample.platform -ne "windows") { throw "wrong platform" }
          if ($sample.cpu.logical_cores -lt 1) { throw "missing CPU inventory" }
          if ($sample.memory.total_bytes -lt 1) { throw "missing memory inventory" }
          if ($sample.disk.total_bytes -lt 1) { throw "missing disk inventory" }
          if ($service.installed) { throw "service unexpectedly installed" }
          if (-not (Test-Path "$root\.yana-ai\os\system-health.json" -PathType Leaf)) { throw "snapshot missing" }

  self-audit:
    name: Yana AI Self-Audit (dogfooding — scanner/*.yml on this repo)
    # .github/workflows/yana-audit.yml is a copy-paste EXAMPLE for other
    # repos (its own header says so, and it explicitly skips itself here:
    # `if: github.repository != 'yanacuti1121/yana-ai'`) — this job is the
    # real thing: the tool that audits other people's agent setups,
    # actually run against its own source, built fresh from this commit
    # rather than a possibly-stale `cargo install`'d release.
    # docs/Yana-AI-Danh-gia-Kien-truc-Bao-mat.md section 3.5 #31.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required for SARIF upload to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)
        with:
          fetch-depth: 0   # needed for --diff origin/<base> on pull_request

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (node24)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Prefetch pdfium (avoids intermittent TLS failure in liteparse-pdfium-sys's own downloader)
        run: bash core/scripts/prefetch-pdfium.sh

      - name: Build yana-rt (release)
        run: cargo build --release --bin yana-rt

      - name: Run self-audit
        run: |
          # On PRs: only the files changed in this PR — a ratchet that
          # blocks new debt without failing on whatever of this repo's
          # existing medium/low findings haven't been cleaned up yet. On
          # push to main: full-repo scan, since there's no "base" diff for
          # a direct push. AU010/CI008 ignored for the same documented
          # reason .github/workflows/yana-audit.yml's own template already
          # ignores them: known-noisy heuristics on a repo that legitimately
          # documents these exact patterns and legitimately publishes
          # packages.
          DIFF_FLAG=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DIFF_FLAG="--diff origin/${{ github.base_ref }}"
          fi
          ./target/release/yana-rt scan . \
            $DIFF_FLAG \
            --fail-on high \
            --ignore AU010 \
            --ignore CI008 \
            --sarif yana-ai-self-audit.sarif \
            --markdown yana-ai-self-audit-report.md

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: yana-ai-self-audit.sarif
          category: yana-ai-self-audit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: yana-ai-self-audit-report
          path: |
            yana-ai-self-audit-report.md
            yana-ai-self-audit.sarif
          retention-days: 30
