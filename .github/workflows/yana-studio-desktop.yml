name: Yana Studio Desktop Build

# Windows and Linux builds for tools/yana-studio, built natively on their
# own OS runner -- not cross-compiled from macOS. Native cross-compilation
# was investigated and rejected: this repo's dev environment has no Wine,
# no running Docker daemon, and no mingw-w64 linker, and yana-studio bundles
# a native node module (node-pty) plus a native Rust binary (yana-rt) --
# both need to be built for the TARGET platform, which native CI runners do
# for free and a local macOS cross-build cannot do reliably.
#
# Modeled directly on .github/workflows/desktop.yml (the sibling
# tools/yana-desktop app's own proven win/linux/mac CI matrix) -- same
# verify-provenance gate, same runtime-build-then-smoke-test-then-stage
# sequence, same pinned action SHAs. Deliberately narrower than desktop.yml:
# linux/x64, win/x64, and win/arm64 (what was actually asked for -- no
# linux/arm64 leg here, unlike desktop.yml), and macOS is intentionally
# left out of this workflow -- Yana Studio's mac release stays the existing
# manual `npm run dist:mac` + `gh release create` process; this workflow's
# publish step attaches its own assets to whatever release already exists
# for the tag (softprops/action-gh-release upserts by tag) rather than
# assuming it must create the release itself, so it can't clobber a mac
# asset uploaded manually under the same tag.
#
# win/arm64 builds natively on the `windows-11-arm` GitHub-hosted runner
# (free for public repos, same tier as the `ubuntu-24.04-arm` runner
# desktop.yml already uses for its own linux/arm64 leg) rather than
# cross-compiling from windows-latest (x64). Native was chosen over cross
# for the same reason this file's own header rejects cross-compiling from
# macOS: yana-studio bundles a native node module (node-pty) and a native
# Rust binary (yana-rt), and a native ARM64 runner builds, ABI-rebuilds,
# and smoke-tests both for the actual target CPU instead of guessing that
# a cross build behaves the same. (node-pty 1.1.0 does ship a win32-arm64
# prebuild, so cross-compiling was probably viable too -- native was still
# preferred because it lets this workflow's existing smoke-test step
# actually execute the shipped yana-rt.exe, which a cross-compiled ARM64
# binary cannot do on an x64 runner.)
#
# Tag prefix is studio-v* (not v*, which is yana-desktop's and the main
# product's own tag prefix, and firing this workflow on those tags would
# be wrong).

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same rationale as desktop.yml's own verify-provenance job: refuse to
  # build/publish a desktop release from a commit that hasn't actually
  # passed this repo's required checks.
  verify-provenance:
    name: Verify commit passed required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify required checks succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REQUIRED=(
            "Hook Tests"
            "Kernel flock-v1 (Ubuntu)"
            "Rust Integration Tests (yana-rt)"
            "System Health Monitor (ubuntu-latest)"
            "System Health Monitor (macos-latest)"
            "System Health Monitor (windows-latest)"
            "Yana AI Self-Audit (dogfooding — scanner/*.yml on this repo)"
          )
          FAILED=0
          for name in "${REQUIRED[@]}"; do
            # --paginate: see desktop.yml's identical comment -- an
            # unpaginated call silently drops required checks past gh
            # api's 30-item default page size.
            conclusion=$(gh api --paginate "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq ".check_runs[] | select(.name==\"$name\") | .conclusion" | head -1)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::Required check '$name' did not succeed for commit $SHA (conclusion: ${conclusion:-none found})"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "This commit did not pass all of main's required checks."
            echo "Refusing to build/publish a desktop release from unverified code."
            exit 1
          fi
          echo "All required checks succeeded for $SHA — proceeding with build."

  build:
    needs: verify-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: |
              tools/yana-studio/release/*.AppImage
              tools/yana-studio/release/*.deb
          - os: windows-latest
            platform: win
            arch: x64
            artifact: |
              tools/yana-studio/release/*.exe
          - os: windows-11-arm
            platform: win
            arch: arm64
            artifact: |
              tools/yana-studio/release/*.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-16

      - name: Build bundled runtime
        run: cargo build --release --features cli --bin yana-rt

      # Same script release.yml and desktop.yml both use to prove the
      # exact shipped binary actually runs, not just that it links --
      # confirmed windows-latest-compatible by release.yml's own matrix,
      # which runs this same script for its x86_64-pc-windows-msvc leg.
      - name: Smoke test bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/yana-rt"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="target/release/yana-rt.exe"; fi
          bash core/scripts/release-smoke-test.sh "$BIN"

      # win-arm64 only. electron-builder's automatic npmRebuild step (via
      # @electron/rebuild) recompiles node-pty's native addon from source
      # for this arch instead of using node-pty's own bundled win32-arm64
      # prebuild (confirmed present at
      # node_modules/node-pty/prebuilds/win32-arm64 -- @electron/rebuild's
      # prebuild-detection just doesn't trust it for this target). The
      # from-source build then fails with MSB8040 ("Spectre-mitigated
      # libraries are required for this project") because node-pty's own
      # binding.gyp deliberately sets `SpectreMitigation: 'Spectre'` (real
      # hardening, not accidental -- see
      # node_modules/node-pty/binding.gyp), and the windows-11-arm hosted
      # runner image doesn't ship the ARM64 Spectre-mitigated VC++ runtime
      # libraries VS component that toolset needs (confirmed missing by
      # the actual MSB8040 failure in CI run 35352268827, job
      # "Build (win-arm64)": every node-pty native target --
      # conpty/conpty_console_list/winpty-agent/winpty -- failed identically).
      # windows-latest (x64) doesn't need this step because that VS
      # component ships there by default; only the ARM64 one is missing.
      # This installs the same real component MSB8040's own linked
      # Microsoft doc (https://aka.ms/Ofhn4c) names as the fix, onto the
      # exact VS edition/path the failing MSBuild invocation used
      # (`...\2022\Enterprise\...`) -- so node-pty's rebuild takes the
      # identical, already-proven code path win-x64 and mac already use
      # (@electron/rebuild logged `buildFromSource=false` for those legs),
      # rather than skipping the rebuild and trusting an untested
      # assumption that the Node.js-ABI prebuild also loads correctly
      # under Electron's ABI.
      - name: Install ARM64 Spectre-mitigated VC++ libs (win-arm64 only)
        if: matrix.arch == 'arm64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          & $installer modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre --quiet --norestart --wait
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "vs_installer.exe exited with $LASTEXITCODE"
          }

      - name: Install yana-studio dependencies
        working-directory: tools/yana-studio
        run: npm ci

      # scripts/stage-runtime.cjs runs its own protocol probe (execs the
      # binary against the headless JSON protocol) before copying it into
      # tools/yana-studio/runtime/ -- a second, narrower check than the
      # smoke test above, not a redundant one.
      - name: Stage bundled runtime
        working-directory: tools/yana-studio
        shell: bash
        run: |
          set -euo pipefail
          BIN="../../target/release/yana-rt"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="../../target/release/yana-rt.exe"; fi
          npm run stage:runtime -- "$BIN"

      - name: Build app
        working-directory: tools/yana-studio
        run: node node_modules/electron-builder/cli.js --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: yana-studio-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Verify and attach Windows/Linux release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '24'

      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (node24)
        with:
          pattern: yana-studio-*
          path: studio-desktop-artifacts

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./tools/yana-studio/package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "studio-v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match yana-studio package version ${VERSION}"
            exit 1
          fi

      # Upserts by tag -- attaches these Windows/Linux assets to whatever
      # release already exists for this tag (including one created
      # manually for the mac build) instead of assuming it must create
      # the release itself.
      - name: Attach Windows/Linux release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 (node24)
        with:
          tag_name: ${{ github.ref_name }}
          files: studio-desktop-artifacts/**
          fail_on_unmatched_files: true
