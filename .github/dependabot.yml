# Dependabot version updates. Security updates (the PRs that fix a published advisory)
# are switched on in the repository settings and are not delayed by `cooldown`.
#
# Each ecosystem is grouped so a week of updates arrives as one PR per directory,
# not one PR per package. The sample projects under core/skills and .claude/skills
# are templates for users and are deliberately not listed here.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      pip-dev:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm-root:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-root-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /github-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-app:
        patterns: ["*"]
        update-types: [minor, patch]
      github-app-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/yana-pixel-bridge
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-pixel-bridge:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-pixel-bridge-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/yana-promo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-promo:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-promo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /tools/yana-terminal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      yana-terminal:
        patterns: ["*"]
        update-types: [minor, patch]
      yana-terminal-security:
        applies-to: security-updates
        patterns: ["*"]
