[package]
name = "yana-rt"
version = "1.3.3"
edition = "2021"
description = "Yana AI Runtime — safety CLI for AI agents: scan, graph, vault, hunt, ci, map, fix, doctor"
license = "Apache-2.0"
repository = "https://github.com/yanacuti1121/yana-ai"
homepage = "https://yanacuti1121.github.io/yana-ai"
documentation = "https://github.com/yanacuti1121/yana-ai#readme"
keywords = ["ai-safety", "claude-code", "security", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "yana-rt"
path = "src/main.rs"
required-features = ["cli"]

# Generic PTY-over-stdio bridge for embedding `yana-rt chat` (or any
# other program) inside Yana AI's Electron desktop app, the same way
# VS Code/Cursor embed their own terminal — Electron's main process
# spawns this as a plain child process and talks to it over stdin/
# stdout, no native Node module required. Deliberately generic (spawns
# whatever argv it's given), not chat-specific. See
# tools/yana-desktop/main.js for the Electron side.
[[bin]]
name = "pty_bridge"
path = "src/bin/pty_bridge.rs"
required-features = ["pty-bridge"]

# PROTOTYPE ONLY — kernel-flock design proof, cross-process/cross-language
# test harness driver. Not the production yana-rt CLI; see
# src/bin/flock_lock_prototype_cli.rs's own header for why a separate
# process (not just cargo test's in-process threads) is needed here.
[[bin]]
name = "flock_lock_prototype_cli"
path = "src/bin/flock_lock_prototype_cli.rs"
required-features = ["flock-lock-prototype"]

[lib]
name = "yana_rt"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = [
  "clap", "uuid", "chrono", "shell-words", "glob", "walkdir",
  "anyhow", "unicode-normalization", "liteparse", "ureq", "serde_yml", "sha2",
  "ratatui", "crossterm",
  "tree-sitter", "tree-sitter-rust", "tree-sitter-typescript",
  "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go",
]
wasm = ["wasm-bindgen", "js-sys"]
# Program J (docs/programs/PROGRAM-J-SKELETON.md) Phase 9 Research/Prototype
# spike ONLY — not wired into any live client path, not part of default
# `cli`. Deliberately isolated: rmcp pulls in tokio (this crate's first
# async runtime dependency, confirmed via docs.rs before adding this —
# every other feature above is sync), and a spike shouldn't change the
# default build's footprint or introduce an async runtime into code that
# doesn't need one yet. `features = ["full"]` on tokio here is a spike
# convenience, not a Phase 10 recommendation — trim to the actual
# required feature set (rt-multi-thread/macros/io-std, likely) once this
# graduates past prototype.
mcp = ["rmcp", "tokio"]
# `pty_bridge` binary only — isolated from `cli` the same way `mcp` is,
# so the default `yana-rt` build never pulls in portable-pty.
pty-bridge = ["portable-pty"]
# `flock_lock_prototype_cli` binary only — kernel-flock locking design
# audit prototype (docs/adr/ADR-008-shared-locking-infrastructure.md
# follow-up), isolated from `cli` and `default` the same way `mcp`/
# `pty-bridge` are. Not wired into any production hook or the main
# `yana-rt` CLI dispatch. Needs sha2 too — this binary reuses
# src/guard/lock.rs's existing, already cross-language-golden-tested
# lock_name_for() (via #[path]) rather than re-deriving lock names by
# hand a second time.
flock-lock-prototype = ["anyhow", "sha2"]

[dependencies]
# Always available (WASM-safe)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
regex      = "1"

# CLI-only — pulled in by the `cli` feature
clap       = { version = "4", features = ["derive"], optional = true }
uuid       = { version = "1", features = ["v4"],     optional = true }
chrono     = { version = "0.4", features = ["serde"], optional = true }
shell-words          = { version = "1",              optional = true }
glob                 = { version = "0.3",            optional = true }
walkdir              = { version = "2",              optional = true }
anyhow               = { version = "1",              optional = true }
unicode-normalization = { version = "0.1",           optional = true }
liteparse  = { version = "2", default-features = false, optional = true }
ureq       = { version = "3", features = ["json"],   optional = true }
serde_yml  = { version = "0.0.13",                   optional = true }
sha2       = { version = "0.10",                     optional = true }
# TUI for `yana chat` — synchronous poll/read API only, deliberately not
# opting into crossterm's `event-stream` feature (would pull in async/
# futures plumbing this crate has nowhere else).
ratatui    = { version = "0.30",                     optional = true }
crossterm  = { version = "0.29",                     optional = true }
# src/graph/build.rs import extraction — replaces per-language regex
# (2026-07-23, Wave 0 finding #2 follow-up: the regex approach was the
# root cause of the graph's noisy/wrong edges, not just the unanchored
# path-matching bug already fixed in resolve_import()).
tree-sitter            = { version = "0.26.11", optional = true }
tree-sitter-rust       = { version = "0.24.2",  optional = true }
tree-sitter-typescript = { version = "0.23.2",  optional = true }
tree-sitter-javascript = { version = "0.25.0",  optional = true }
tree-sitter-python     = { version = "0.25.0",  optional = true }
tree-sitter-go         = { version = "0.25.0",  optional = true }

# Program J Phase 9 spike only (see `mcp` feature above) — pinned to the
# stable 2.2.0 line, not crates.io's max_version 3.0.0-beta.1, per Phase 8
# Design Review's own finding: a beta dependency on a security-critical
# guard path is a real risk, not a style preference.
rmcp  = { version = "=2.2.0", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# `pty_bridge` binary only (see `pty-bridge` feature above) — the same
# crate the wezterm terminal emulator uses; cross-platform (handles
# Windows ConPTY as well as Unix ptys), avoids reimplementing PTY
# allocation's real OS-level edge cases from scratch.
portable-pty = { version = "0.9", optional = true }

# WASM
wasm-bindgen = { version = "0.2", optional = true }
js-sys       = { version = "0.3", optional = true }

# flock(2) is Unix-only (macOS/Linux, matching this repo's actual filesystem
# targets — see docs/adr/ADR-008-shared-locking-infrastructure.md's kernel-
# lock follow-up audit). Not a new dependency in practice: libc 0.2.186 is
# already resolved transitively in Cargo.lock (pulled in by crossterm/
# tree-sitter's own dependency trees) — this pins the exact same version as
# a direct dependency so src/guard/flock_lock.rs can call libc::flock
# without hand-writing FFI bindings, adding zero new compiled code to any
# build that already includes the `cli` feature. Scoped to cfg(unix) rather
# than added unconditionally since it's meaningless outside that target and
# the `guard` module tree (src/main.rs's `mod guard;`) is never compiled
# into the WASM cdylib target (src/lib.rs has its own separate `mod wasm`
# that does not include `guard` — confirmed by reading src/lib.rs directly).
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3"

